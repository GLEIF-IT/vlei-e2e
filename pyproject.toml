[project]
name = "vlei-e2e"
version = "0.1.1"
description = "Add your description here"
license = { file = "LICENSE" }
readme = "README.md"
authors = [
    { name = "Kent Bull", email = "kent.bull@gleif.org" }
]
requires-python = ">=3.12.3"
dependencies = [
    "gleif_hio==0.6.21",
    "gleif_keri==1.2.17",
    "gleif_keria==0.4.4",
    "sally==1.0.8",
    "signifypy==0.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.3,<9.0.0",  # Pin for stability; latest as of Sep 2025
    # Add other test deps if needed, e.g., pytest-mock, pytest-asyncio
]

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
signifypy = { git = "https://github.com/kentbull/signifypy.git", rev = "4a2fab44f2d22b2f4c13cf7f98a6700ead753554" }
