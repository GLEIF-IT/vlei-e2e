[project]
name = "vlei-e2e"
version = "0.1.1"
description = "Add your description here"
license = { file = "LICENSE" }
readme = "README.md"
authors = [
    { name = "Kent Bull", email = "kent.bull@gleif.org" }
]
requires-python = ">=3.12.3"
dependencies = [
    "gleif_hio==0.6.22",
    "gleif_keri==1.2.19",
    "gleif_keria==0.4.7",
    "sally==1.0.11",
    "signifypy==0.4.2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10.0.0",
    # Add other test deps if needed, e.g., pytest-mock, pytest-asyncio
]

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
signifypy = { git = "https://github.com/kentbull/signifypy.git", rev = "1e2971a16c7a3fa528562a57015f2b269f989469" }
