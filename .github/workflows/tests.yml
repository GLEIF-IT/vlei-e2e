name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.5"
      - run: uv sync --locked --extra test --python 3.12
      - run: uv pip check
      - run: uv run --no-sync pytest -q --tb=short
